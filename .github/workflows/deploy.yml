name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No committed lockfile yet, so resolve fresh. (Swap to `npm ci` once a
      # package-lock.json is committed for reproducible installs.)
      - name: Install dependencies
        run: npm install
      # Relative base makes the build work at a project-pages subpath
      # (e.g. /Product-Demo-Lander/) without hardcoding the path.
      - name: Build
        run: npx vite build --base=./
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
